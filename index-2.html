<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Debaro Apple Store</title>
<style>
:root{--bleu:#0f2a5c;--jaune:#f5c32c;--vert:#1faa59;--fond:#f2f4f8;--texte:#1b1f2a;--gris:#5d6577}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--fond);color:var(--texte);line-height:1.5}
header{background:var(--bleu);color:#fff;padding:28px 18px 34px}
.entete{display:flex;align-items:center;gap:14px;margin-bottom:6px}.logo{width:68px;height:68px;border-radius:50%;background:#fff;object-fit:cover;flex:none}
header h1{font-size:1.7rem;line-height:1.15}
header p{margin:10px 0 18px;color:#d3dcf5;max-width:26em}
.btn{display:inline-block;background:var(--vert);color:#fff;text-decoration:none;font-weight:700;padding:12px 18px;border-radius:10px;border:0;font-size:1rem}
.btn.jaune{background:var(--jaune);color:var(--bleu)}
.infos{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:18px;font-size:.9rem;color:#d3dcf5}
main{max-width:900px;margin:0 auto;padding:18px}
h2{font-size:1.3rem;margin:6px 0 12px}
.filtres{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.filtres button{flex:none;border:2px solid var(--bleu);background:#fff;color:var(--bleu);padding:7px 14px;border-radius:99px;font-weight:600;font-size:.95rem}
.filtres button.actif{background:var(--bleu);color:#fff}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-top:6px}
.carte{background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.photo{height:190px;background:#dfe5f2;display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.etat{position:absolute;top:10px;left:10px;background:var(--jaune);color:var(--bleu);font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:6px}
.corps{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.corps h3{font-size:1.05rem}
.spec{color:var(--gris);font-size:.88rem}
.prix{font-size:1.35rem;font-weight:800;color:var(--bleu);margin:4px 0 8px}
.corps .btn{margin-top:auto;text-align:center;padding:10px}
.vide{padding:20px;color:var(--gris)}
.garanties{display:grid;gap:10px;margin:26px 0}
.garanties div{background:#fff;border-left:6px solid var(--jaune);padding:12px 14px;border-radius:8px}
.garanties b{display:block}
footer{background:var(--bleu);color:#d3dcf5;padding:22px 18px;font-size:.92rem}
.flottant{position:fixed;right:14px;bottom:14px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
:focus-visible{outline:3px solid var(--jaune);outline-offset:2px}
</style>
</head>
<body>

<header>
  <div class="entete"><img class="logo" src="logo-1.jpg" alt="Logo"><h1 id="nom"></h1></div>
  <p id="slogan"></p>
  <a class="btn jaune" id="btnHero" href="#">Écrire sur WhatsApp</a>
  <div class="infos"><span id="adresse"></span><span id="horaires"></span></div>
</header>

<main>
  <h2>Nos téléphones</h2>
  <div class="filtres" id="filtres"></div>
  <div class="grille" id="grille"></div>

  <div class="garanties" id="garanties"></div>
</main>

<footer id="pied"></footer>
<a class="btn flottant" id="btnFlottant" href="#">WhatsApp</a>

<script>
/* ============ À MODIFIER POUR CHAQUE CLIENT ============ */
const BOUTIQUE = {
  nom: "Debaro Apple Store",
  slogan: "Votre satisfaction, notre bénéfice. iPhone neufs et quasi neufs à Treichville.",
  whatsapp: "2250173470128",   // numéro avec indicatif, sans + ni espaces
  adresse: "Treichville, marché Samsung",
  horaires: "",                // laisse vide si tu ne veux pas l'afficher
  garanties: [
    ["Fiabilité", "Respect à nos clients fidèles."],
    ["Qualité", "iPhone neufs et quasi neufs. L'état de la batterie peut être montré avant l'achat."],
    ["Garantie", "Demande les conditions de garantie sur WhatsApp."]
  ]
};

// prix: nombre en FCFA, ou 0 si le prix n'est pas encore donné
// etat: "Neuf", "Quasi neuf" ou "Occasion" | image: nom du fichier photo (ou "" pour l'icône)
const PRODUITS = [
  {marque:"iPhone", modele:"iPhone 15 Pro", spec:"512 Go · batterie 100 % · titane naturel", prix:0, etat:"Occasion", image:"iphone-15-pro-1.jpg"},
  {marque:"iPhone", modele:"iPhone XR 64 Go", spec:"6 couleurs disponibles", prix:115000, etat:"Quasi neuf", image:"iphone-xr.jpg"},
  {marque:"iPhone", modele:"iPhone XR 128 Go", spec:"6 couleurs disponibles", prix:125000, etat:"Quasi neuf", image:"iphone-xr.jpg"},
  {marque:"iPhone", modele:"iPhone 17 (Air, Pro, Pro Max)", spec:"Nouvelle série", prix:0, etat:"Neuf", image:""}
];
/* ======================================================== */

const fcfa = n => n.toLocaleString("fr-FR") + " FCFA";
const lienWA = msg => "https://wa.me/" + BOUTIQUE.whatsapp + "?text=" + encodeURIComponent(msg);

document.title = BOUTIQUE.nom;
document.getElementById("nom").textContent = BOUTIQUE.nom;
document.getElementById("slogan").textContent = BOUTIQUE.slogan;
document.getElementById("adresse").textContent = BOUTIQUE.adresse;
document.getElementById("horaires").textContent = BOUTIQUE.horaires;
document.getElementById("pied").textContent = BOUTIQUE.nom + " · " + BOUTIQUE.adresse + (BOUTIQUE.horaires ? " · " + BOUTIQUE.horaires : "");

const bonjour = lienWA("Bonjour, je voudrais des informations sur vos téléphones.");
document.getElementById("btnHero").href = bonjour;
document.getElementById("btnFlottant").href = bonjour;

document.getElementById("garanties").innerHTML = BOUTIQUE.garanties
  .map(g => "<div><b>" + g[0] + "</b>" + g[1] + "</div>").join("");

const marques = ["Tous", ...new Set(PRODUITS.map(p => p.etat))];
let choix = "Tous";

function afficher(){
  document.getElementById("filtres").innerHTML = marques.map(m =>
    '<button class="' + (m === choix ? "actif" : "") + '" data-m="' + m + '">' + m + "</button>").join("");

  const liste = PRODUITS.filter(p => choix === "Tous" || p.etat === choix);
  document.getElementById("grille").innerHTML = liste.length ? liste.map(p => {
    const photo = p.image ? '<img src="' + p.image + '" alt="' + p.modele + '">' : "📱";
    const prixTxt = p.prix ? fcfa(p.prix) : "Prix sur demande";
    const msg = "Bonjour, je suis intéressé par le " + p.modele + " (" + p.etat.toLowerCase() + ")" + (p.prix ? " à " + fcfa(p.prix) : "") + ". Il est encore disponible ?";
    return '<article class="carte"><div class="photo">' + photo + '<span class="etat">' + p.etat + '</span></div>' +
      '<div class="corps"><h3>' + p.modele + '</h3><div class="spec">' + p.spec + '</div>' +
      '<div class="prix">' + prixTxt + '</div>' +
      '<a class="btn" href="' + lienWA(msg) + '">Commander sur WhatsApp</a></div></article>';
  }).join("") : '<p class="vide">Aucun téléphone dans cette catégorie pour le moment.</p>';
}

document.getElementById("filtres").addEventListener("click", e => {
  if (e.target.dataset.m){ choix = e.target.dataset.m; afficher(); }
});
afficher();
</script>
</body>
</html>
